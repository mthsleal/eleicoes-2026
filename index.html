<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Eleições 2026 · acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#f4f6f7; --surface:#fff; --ink:#0f1b24; --muted:#6b7781; --line:#e2e7ea; --accent:#005471; --accent-ink:#fff; --erro:#9a004f;
  --ui:"Manrope","Segoe UI",system-ui,sans-serif; --num:"IBM Plex Mono",ui-monospace,Consolas,monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0c1217; --surface:#121a20; --ink:#e7edf1; --muted:#8b97a1; --line:#223039; --accent:#3f97b9; --accent-ink:#0c1217; --erro:#d2508f; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#0c1217; --surface:#121a20; --ink:#e7edf1; --muted:#8b97a1; --line:#223039; --accent:#3f97b9; --accent-ink:#0c1217; --erro:#d2508f; color-scheme: dark; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--ui); display:grid; place-items:center; padding:16px; box-sizing:border-box; }
form { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px 26px; width:min(360px,100%); box-sizing:border-box; display:grid; gap:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
h1 { margin:0 0 2px; font-size:17px; font-weight:800; letter-spacing:-.01em; }
p.sub { margin:0 0 10px; color:var(--muted); font-size:12.5px; }
label { display:grid; gap:4px; font-size:12px; font-weight:600; color:var(--muted); }
input { font:500 14px var(--num); padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); }
input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
button { font:700 14px var(--ui); background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px; padding:11px 16px; cursor:pointer; margin-top:4px; }
button[disabled] { opacity:.6; cursor:wait; }
.erro { color:var(--erro); font-size:12.5px; min-height:1.2em; margin:0; }
.rodape { font-size:12px; color:var(--muted); margin:6px 0 0; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Eleições 2026 · monitoramento</h1>
  <p class="sub">Acesso restrito. O conteúdo é decifrado no seu navegador.</p>
  <label>Usuário <input id="u" name="username" autocomplete="username" required autofocus></label>
  <label>Senha <input id="s" name="password" type="password" autocomplete="current-password" required></label>
  <p class="erro" id="e"></p>
  <button id="b" type="submit">Entrar</button>
  <p class="rodape" id="r">Elaboração própria. Nada aqui é publicação oficial do TSE.</p>
</form>
<script>// cripto.js — a MESMA rotina no navegador (loader e app) e no Node (site/cifrar.mjs).
// Chave: PBKDF2-SHA256(UTF8(usuario_lower_trim + ":" + senha), salt "eleicoes-2026:v1", 200.000 it) -> AES-256-GCM.
// Arquivo cifrado: iv(12) || ciphertext || tag(16)  (= iv + saída do subtle.encrypt). Sem AAD, sem cabeçalho.
globalThis.EL26 = (() => {
  const SALT = "eleicoes-2026:v1", ITERACOES = 200000;
  const te = new TextEncoder(), td = new TextDecoder();
  const sub = globalThis.crypto.subtle;
  async function chave(usuario, senha) {
    const mat = await sub.importKey("raw", te.encode(String(usuario).trim().toLowerCase() + ":" + String(senha)),
                                    "PBKDF2", false, ["deriveBits"]);
    const bits = await sub.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: te.encode(SALT), iterations: ITERACOES }, mat, 256);
    return new Uint8Array(bits);
  }
  const importar = raw => sub.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
  async function cifrar(raw, bytes) {
    const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await sub.encrypt({ name: "AES-GCM", iv }, await importar(raw), bytes));
    const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
    return out;
  }
  async function decifrar(raw, bytes) {
    const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    return new Uint8Array(await sub.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, await importar(raw), b.slice(12)));
  }
  const b64 = u8 => btoa(Array.from(u8, c => String.fromCharCode(c)).join(""));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  return { chave, cifrar, decifrar, b64, unb64, texto: u8 => td.decode(u8), bytes: s => te.encode(s), SALT, ITERACOES };
})();</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const KEY = "el26.k";
  if (location.search.includes("sair")) { sessionStorage.removeItem(KEY); history.replaceState(null, "", location.pathname + location.hash); }
  async function abrir(raw) {
    const r = await fetch("app.html.enc?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("app.html.enc: HTTP " + r.status);
    const html = EL26.texto(await EL26.decifrar(raw, new Uint8Array(await r.arrayBuffer())));
    sessionStorage.setItem(KEY, EL26.b64(raw));
    document.open(); document.write(html); document.close();
  }
  const salva = sessionStorage.getItem(KEY);
  if (salva) { $("f").style.visibility = "hidden"; abrir(EL26.unb64(salva)).catch(() => { sessionStorage.removeItem(KEY); $("f").style.visibility = "visible"; }); }
  $("f").addEventListener("submit", async ev => {
    ev.preventDefault(); $("e").textContent = ""; $("b").disabled = true; $("b").textContent = "Abrindo…";
    try { await abrir(await EL26.chave($("u").value, $("s").value)); }
    catch (err) {
      $("e").textContent = /OperationError|decrypt/i.test(String(err && (err.name + err.message))) ? "Usuário ou senha incorretos." : "Não foi possível abrir: " + (err && err.message || err);
      $("b").disabled = false; $("b").textContent = "Entrar";
    }
  });
})();
</script>
</body>
</html>
